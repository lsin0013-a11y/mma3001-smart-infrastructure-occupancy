[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-infra"
version = "0.2.0"
description = "Occupancy-based ventilation for a Monash Smart Infrastructure room: headcount forecasting and CO2 simulation (MMA3001 project)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
